[common]
framework = arduino
platform = espressif32
monitor_speed = 115200
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -D CORE_DEBUG_LEVEL=3

; Original ESP32 dev board (breadboard prototype)
[env:esp32dev]
extends = common
board = esp32dev

; ESP32-S3 custom PCB
[env:esp32s3]
extends = common
board = esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D JOYSTICK_X_PIN=4
    -D JOYSTICK_Y_PIN=5
    -D JOYSTICK_BTN_PIN=12
    -D STATUS_LED_PIN=2
    -D ZOOM_POT_PIN=6
