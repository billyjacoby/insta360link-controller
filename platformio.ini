[common]
framework = arduino
platform = espressif32
monitor_speed = 115200
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=3

; Original ESP32 dev board (breadboard prototype)
[env:esp32dev]
extends = common
board = esp32dev

; ESP32-S3 custom PCB
[env:esp32s3]
extends = common
board = esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DJOYSTICK_X_PIN=4
    -DJOYSTICK_Y_PIN=5
    -DJOYSTICK_BTN_PIN=12
    -DSTATUS_LED_PIN=2
    -DZOOM_POT_PIN=6
