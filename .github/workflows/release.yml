name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: daemon-mac
            arch: arm64
          - os: macos-14
            target: linkctl-cli-mac
            arch: arm64
          - os: macos-14
            target: gui-mac
            arch: arm64
          - os: macos-15-intel
            target: gui-mac
            arch: x86_64
          # - os: windows-latest
          #   target: daemon-win
          #   arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must be vX.Y.Z" >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      # --- daemon-mac ---
      - name: Install dependencies (macOS daemon)
        if: matrix.target == 'daemon-mac'
        run: brew install libwebsockets cjson openssl@3 pkgconf

      - name: Build daemon (macOS)
        if: matrix.target == 'daemon-mac'
        working-directory: host/linkctl-daemon
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu)

      - name: Package daemon release (macOS)
        if: matrix.target == 'daemon-mac'
        id: package-daemon
        run: |
          STAGING="linkctl-daemon-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}"
          mkdir -p "$STAGING"
          cp host/linkctl-daemon/build/linkctl-daemon "$STAGING/"
          cp host/linkctl-daemon/install.sh "$STAGING/"
          chmod +x "$STAGING/install.sh"
          cp README.md "$STAGING/"
          tar czf "${STAGING}.tar.gz" "$STAGING"
          echo "ARCHIVE=${STAGING}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload daemon artifact
        if: matrix.target == 'daemon-mac'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ steps.package-daemon.outputs.ARCHIVE }}

      # --- linkctl CLI (macOS) — no external dependencies ---
      - name: Build linkctl CLI (macOS)
        if: matrix.target == 'linkctl-cli-mac'
        working-directory: host/linkctl
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(sysctl -n hw.ncpu)

      - name: Package linkctl release (macOS)
        if: matrix.target == 'linkctl-cli-mac'
        id: package-cli
        run: |
          STAGING="linkctl-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}"
          mkdir -p "$STAGING"
          cp host/linkctl/build/linkctl "$STAGING/"
          cp host/linkctl/README.md "$STAGING/"
          tar czf "${STAGING}.tar.gz" "$STAGING"
          echo "ARCHIVE=${STAGING}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload linkctl artifact
        if: matrix.target == 'linkctl-cli-mac'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ steps.package-cli.outputs.ARCHIVE }}

      - name: Install standalone app build dependencies
        if: matrix.target == 'gui-mac'
        run: brew install cmake libwebsockets cjson openssl@3 pkgconf

      - name: Test standalone app
        if: matrix.target == 'gui-mac'
        working-directory: host/linkctl-gui
        run: swift test

      - name: Package standalone app
        if: matrix.target == 'gui-mac'
        run: |
          ARCHIVE="Link-Control-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.zip"
          VERSION="${{ steps.version.outputs.VERSION }}" \
          BUILD_NUMBER="${{ github.run_number }}" \
          ZIP_OUTPUT="$ARCHIVE" \
          bash host/linkctl-gui/scripts/package-app.sh
          test "$(plutil -extract CFBundleShortVersionString raw 'host/linkctl-gui/dist/Link Control.app/Contents/Info.plist')" = "${{ steps.version.outputs.VERSION }}"

      - name: Test bundled Raycast commands
        if: matrix.target == 'gui-mac'
        run: LINK_CONTROL_SCRIPT_DIR="$PWD/host/linkctl-gui/dist/Link Control.app/Contents/Resources/Raycast" python3 integrations/tests/test_raycast.py

      - name: Upload standalone app artifact
        if: matrix.target == 'gui-mac'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            Link-Control-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.zip
            Link-Control-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.zip.sha256
            Link-Control-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.metadata.json

      - name: Verify automatic startup with packaged helper
        if: matrix.target == 'gui-mac'
        working-directory: host/linkctl-gui
        run: LINKCTL_TEST_BUNDLE="$PWD/dist/Link Control.app" swift test --filter PackagedAppTests

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
            *.sha256
            *.metadata.json
          draft: true
          generate_release_notes: true
